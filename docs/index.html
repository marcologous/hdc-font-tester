<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hanken Design Co.&reg; Type Tester</title>
<link rel="stylesheet" href="tester.css" />
</head>
<body>
<div class="hdc-tester" id="hdc-tester">
  <header class="hdc-toolbar">
    <div class="hdc-toolbar__controls">
      <button type="button" id="hdc-invert-toggle" class="hdc-invert-btn" aria-pressed="false">Invert</button>
      <div class="hdc-font-picker" id="hdc-font-picker">
        <button
          type="button"
          id="hdc-font-picker-btn"
          class="hdc-select hdc-font-picker__btn"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span id="hdc-font-picker-label">Loading fonts…</span>
        </button>
        <div id="hdc-font-panel" class="hdc-font-panel" hidden>
          <input
            type="text"
            id="hdc-font-search"
            class="hdc-font-search"
            placeholder="Search fonts…"
            autocomplete="off"
            aria-label="Search fonts"
          />
          <ul id="hdc-font-listbox" class="hdc-font-listbox" role="listbox"></ul>
        </div>
      </div>
    </div>
  </header>

  <p id="hdc-status" class="hdc-status" hidden></p>

  <div class="hdc-panel">
    <div class="hdc-sliders">
      <div class="hdc-control">
        <div class="hdc-control__head">
          <label for="hdc-size">Size</label>
          <span class="hdc-control__value" id="hdc-size-value"></span>
        </div>
        <input type="range" id="hdc-size" min="8" max="300" step="1" value="48" />
      </div>

      <div class="hdc-control">
        <div class="hdc-control__head">
          <label for="hdc-tracking">Tracking</label>
          <span class="hdc-control__value" id="hdc-tracking-value"></span>
        </div>
        <input type="range" id="hdc-tracking" min="-100" max="500" step="1" value="0" />
      </div>

      <div class="hdc-control">
        <div class="hdc-control__head">
          <label for="hdc-leading">Leading</label>
          <span class="hdc-control__value" id="hdc-leading-value"></span>
        </div>
        <input type="range" id="hdc-leading" min="80" max="250" step="1" value="120" />
      </div>
    </div>
  </div>

  <div class="hdc-preview-card">
    <div
      id="hdc-preview"
      class="hdc-preview"
      contenteditable="true"
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
    >Handgloves &amp; Jackdaws quiz nymph — 0123456789</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lib-font@3.0.4/lib/inflate.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lib-font@3.0.4/lib/unbrotli.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lib-font@3.0.4/lib-font.js" type="module" defer></script>
<script src="tester.js" defer></script>
<script src="resize-notifier.js" defer></script>
</body>
</html>
