<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HDC Font Tester</title>
<link rel="stylesheet" href="tester.css" />
</head>
<body>
<div class="hdc-tester" id="hdc-tester">
  <header class="hdc-toolbar">
    <span class="hdc-brand">Type Tester</span>
    <select id="hdc-font-select" class="hdc-select"></select>
  </header>

  <div class="hdc-preview-card">
    <div
      id="hdc-preview"
      class="hdc-preview"
      contenteditable="true"
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
    >Handgloves &amp; hamburgefonstiv quiz nymph — 0123456789</div>
  </div>

  <div class="hdc-panel">
    <div class="hdc-sliders">
      <div class="hdc-control">
        <div class="hdc-control__head">
          <label for="hdc-size">Size</label>
          <span class="hdc-control__value" id="hdc-size-value"></span>
        </div>
        <input type="range" id="hdc-size" min="8" max="300" step="1" value="48" />
      </div>

      <div class="hdc-control">
        <div class="hdc-control__head">
          <label for="hdc-tracking">Tracking</label>
          <span class="hdc-control__value" id="hdc-tracking-value"></span>
        </div>
        <input type="range" id="hdc-tracking" min="-100" max="500" step="1" value="0" />
      </div>

      <div class="hdc-control">
        <div class="hdc-control__head">
          <label for="hdc-leading">Leading</label>
          <span class="hdc-control__value" id="hdc-leading-value"></span>
        </div>
        <input type="range" id="hdc-leading" min="80" max="250" step="1" value="120" />
      </div>
    </div>

    <div class="hdc-features">
      <h3>OpenType Features</h3>
      <div id="hdc-feature-list" class="hdc-chip-list">
        <p class="hdc-feature-empty">Loading fonts…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="tester.js"></script>
</body>
</html>
